<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">manayim Portfolio Preview</title>
  <desc id="desc">A Bento-style preview for manayim's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.64" stop-color="#111827"/>
      <stop offset="1" stop-color="#07362f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="56" cy="56" r="38"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .shell { fill: rgba(13, 17, 23, 0.76); stroke: rgba(88, 166, 255, 0.22); stroke-width: 1; }
      .card { fill: rgba(22, 27, 34, 0.95); stroke: rgba(139, 148, 158, 0.24); stroke-width: 1; }
      .muted { fill: #9aa4b2; }
      .text { fill: #f0f6fc; }
      .green { fill: #3fb950; }
      .blue { fill: #58a6ff; }
      .orange { fill: #f78166; }
      .rule { stroke: rgba(139, 148, 158, 0.18); stroke-width: 1; }
    </style>
  </defs>

  <rect width="920" height="360" rx="18" fill="url(#bg)"/>
  <path d="M0 308 C128 250 226 334 366 306 C508 278 594 232 744 254 C822 266 870 298 920 278 L920 360 L0 360 Z" fill="#0a362f" opacity="0.42"/>

  <rect x="34" y="34" width="852" height="292" rx="20" class="shell"/>

  <g transform="translate(64 64)">
    <rect x="0" y="0" width="316" height="232" rx="18" class="card"/>
    <circle cx="56" cy="56" r="40" fill="#0d1117"/>
    <image x="18" y="18" width="76" height="76" href="https://avatars.githubusercontent.com/u/29697270?v=4" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="56" cy="56" r="39" fill="none" stroke="rgba(139, 148, 158, 0.62)" stroke-width="1"/>
    <text x="112" y="52" class="sans text" font-size="26" font-weight="800">manayim</text>
    <text x="112" y="80" class="sans muted" font-size="15" font-weight="600">Full Stack Developer</text>
    <line x1="28" y1="116" x2="288" y2="116" class="rule"/>
    <text x="28" y="150" class="sans blue" font-size="15" font-weight="760">Focus</text>
    <text x="28" y="181" class="sans text" font-size="21" font-weight="800">Building cool things</text>
    <text x="28" y="211" class="sans muted" font-size="15">Next.js · TypeScript · Tailwind</text>

    <rect x="340" y="0" width="212" height="104" rx="18" class="card"/>
    <text x="366" y="35" class="sans blue" font-size="15" font-weight="760">Main project</text>
    <text x="366" y="69" class="sans text" font-size="21" font-weight="800">EchoAgent</text>
    <text x="366" y="94" class="sans green" font-size="18" font-weight="800">Multi-Agent Engine</text>

    <rect x="580" y="0" width="212" height="104" rx="18" class="card"/>
    <text x="606" y="35" class="sans orange" font-size="15" font-weight="760">Tech Stack</text>
    <text x="606" y="70" class="sans text" font-size="24" font-weight="800">Next.js · TS</text>
    <text x="606" y="94" class="sans muted" font-size="14">TailwindCSS · React</text>

    <rect x="340" y="128" width="212" height="104" rx="18" class="card"/>
    <text x="366" y="163" class="sans blue" font-size="15" font-weight="760">Interests</text>
    <text x="366" y="201" class="sans text" font-size="21" font-weight="800">AI · Automation</text>

    <rect x="580" y="128" width="212" height="104" rx="18" fill="url(#accent)"/>
    <text x="606" y="163" class="sans" fill="#ffffff" font-size="15" font-weight="760">Open to</text>
    <text x="606" y="201" class="sans" fill="#ffffff" font-size="24" font-weight="850">Collaboration</text>
